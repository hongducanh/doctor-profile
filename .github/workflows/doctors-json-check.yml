# Kiểm "data/doctors.json đã commit = file build ra" + hợp đồng v1 (spec greenfield-os/docs/doctor-list-spec.md §3.1, F-4).
# Chỉ thêm tín hiệu: Vercel deploy không chờ CI. Không cần cài gói (chỉ dùng node:fs).
name: doctors-json-check
on:
  push: { branches: [main], paths: ["data/doctors.json", "_build/**", "dr-*/img/**"] }
  pull_request: { paths: ["data/doctors.json", "_build/**", "dr-*/img/**"] }
  workflow_dispatch: {}
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: node _build/doctors-json.mjs --check
